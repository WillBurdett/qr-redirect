services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume = your data lives here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d qrdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports published: only the app container can reach Postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/qrdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Caddy terminates TLS, so trust its X-Forwarded-* headers (needed for secure session cookies)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      ADMIN_EMAIL: admin@prod.com
      ADMIN_PASSWORD: password

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config: