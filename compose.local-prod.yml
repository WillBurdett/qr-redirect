services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: qrdb
      POSTGRES_USER: qr
      POSTGRES_PASSWORD: qr
    volumes:
      - prodtest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr -d qrdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/qrdb
      DB_USER: qr
      DB_PASSWORD: qr
      APP_BASE_URL: http://localhost:8080
      ADMIN_EMAIL: admin@prod.com
      ADMIN_PASSWORD: password
      COOKIE_SECURE: "false"

volumes:
  prodtest-pgdata:


