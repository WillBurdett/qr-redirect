# Production: Postgres. Set these environment variables on your host:
#   DB_URL       e.g. jdbc:postgresql://host:5432/qrdb   (must be a JDBC URL)
#   DB_USER
#   DB_PASSWORD
#   APP_BASE_URL e.g. https://qr.yourdomain.com
#   APP_APIKEYS_<COMPANYID>=<secret>   e.g. APP_APIKEYS_ACME=long-random-string
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Never try to start Docker containers in production
spring.docker.compose.enabled=false
