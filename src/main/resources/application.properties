spring.application.name=qr-redirect
server.port=${PORT:8080}

# "dev" is used unless SPRING_PROFILES_ACTIVE says otherwise (e.g. "prod")
spring.profiles.default=dev

spring.jpa.open-in-view=false
# MVP convenience. Move to Flyway/Liquibase migrations before real customers.
spring.jpa.hibernate.ddl-auto=update

# Redirect lookups are cached briefly. Updates evict the entry on the instance that
# handled them; other instances (if you scale out) pick the change up within the TTL.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=60s

# Lets API errors (400/404) carry a useful message
server.error.include-message=always

# Public base URL baked into every QR code. Choose it once: printed codes depend on it.
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Allow plain http:// redirect targets (leave false in production)
app.allow-http=false