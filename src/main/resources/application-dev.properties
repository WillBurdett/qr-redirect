# Local development: file-based H2 database in ./data, plus a demo API key.
spring.datasource.url=jdbc:h2:file:./data/qrdb
spring.datasource.username=sa
spring.datasource.password=

# companyId=key. Remove this in production and configure real keys via env vars.
app.api-keys.demo=dev-key-change-me

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
