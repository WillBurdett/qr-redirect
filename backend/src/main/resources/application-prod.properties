# Production: Postgres. Set these environment variables on your host:
#   DB_URL       e.g. jdbc:postgresql://host:5432/qrdb   (must be a JDBC URL)
#   DB_USER
#   DB_PASSWORD
#   APP_BASE_URL e.g. https://qr.yourdomain.com
#   APP_APIKEY=<long random secret>   (temporary operator key, replaced by operator login in the next step)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Never try to start Docker containers in production
spring.docker.compose.enabled=false

# Flyway may migrate, but never wipe
spring.flyway.clean-disabled=true

# Behind a load balancer / reverse proxy that terminates HTTPS
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Only the health check is exposed
management.endpoints.web.exposure.include=health