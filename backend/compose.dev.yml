services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qrdb
      POSTGRES_USER: qr
      POSTGRES_PASSWORD: qr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr -d qrdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: